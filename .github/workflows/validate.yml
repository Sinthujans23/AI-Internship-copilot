name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npm run check:secrets
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:ranking
      - run: node scripts/test-cv-v2-db.mjs
      - run: for suite in hybrid github rag learning tracker tailoring production; do node scripts/test-cv-v2-db.mjs --$suite || exit 1; done
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matching-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m pip check
      - run: python -m unittest discover -p 'test_*.py'
      - run: python -m pip_audit -r requirements.txt
