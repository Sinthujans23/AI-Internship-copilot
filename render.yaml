services:
  - type: web
    name: ai-internship-matching
    runtime: python
    rootDir: matching-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: MATCHING_SERVICE_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: MATCH_THRESHOLD
        value: "0.65"
